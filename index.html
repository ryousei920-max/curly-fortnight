<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>スイングコーチ</title>
<style>
:root{--bg:#0f1512;--panel:#18211c;--line:#2b3a31;--text:#e9f1ec;--sub:#9db3a6;--accent:#4ade80;--warn:#fbbf24;--bad:#f87171}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-text-size-adjust:100%}
header{padding:14px 16px 6px;display:flex;align-items:baseline;gap:10px}
header h1{font-size:20px;margin:0}
header span{color:var(--sub);font-size:12px}
main{padding:0 16px 40px;max-width:720px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
label{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
select,button{font:inherit;color:var(--text);background:#223028;border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
button.primary{background:var(--accent);color:#06210f;font-weight:700;border:none;padding:14px}
button:disabled{opacity:.5}
.row{display:flex;gap:10px}.row>*{flex:1}
#stage{position:relative;background:#000;border-radius:14px;overflow:hidden;display:none}
#stage canvas{width:100%;display:block}
#status{position:absolute;left:10px;top:10px;padding:6px 10px;border-radius:999px;background:rgba(0,0,0,.6);font-size:14px;font-weight:700}
#status.ready{color:var(--accent)}#status.wait{color:var(--sub)}#status.busy{color:var(--warn)}
.res h3{margin:0 0 8px;font-size:16px}
.res ul{margin:6px 0 0;padding-left:18px}.res li{margin:4px 0;line-height:1.5}
.metric{display:flex;justify-content:space-between;font-size:13px;border-bottom:1px dashed var(--line);padding:4px 0}
.metric b{font-variant-numeric:tabular-nums}
.ok{color:var(--accent)}.ng{color:var(--bad)}
small,.note{color:var(--sub);font-size:12px;line-height:1.6}
#log{white-space:pre-wrap;font-size:11px;color:var(--sub)}
</style>
</head>
<body>
<header><h1>スイングコーチ</h1><span>後ろからの撮影用・試作版</span></header>
<main>
  <div class="card" id="setup">
    <label for="theme">今日の練習テーマ</label>
    <select id="theme">
      <option value="全部">全部</option><option value="前傾">前傾(起き上がり・伸び上がり)</option>
      <option value="軌道">軌道(アウトサイドイン)</option><option value="頭">頭の上下</option>
      <option value="回転">回転</option><option value="左腕">左腕</option>
    </select>
    <div class="row">
      <div><label for="mode">モード</label>
        <select id="mode"><option value="初心者">初心者(プロと比較)</option><option value="上級者">上級者(自分と比較)</option></select></div>
      <div><label for="hand">利き手</label>
        <select id="hand"><option value="R">右打ち</option><option value="L">左打ち</option></select></div>
    </div>
    <label for="quality">解析の細かさ</label>
    <select id="quality"><option value="1">ふつう(おすすめ)</option><option value="0">軽い(古いスマホ向け)</option></select>
    <p class="note">スマホを体の後ろ側(飛球線の後方)に置き、頭から足まで全身が入るように固定してください。構えて止まると「チェック開始」、フィニッシュのあとに結果を音声で伝えます。イヤホンをつないでおくと便利です。</p>
    <div class="row" style="margin-top:10px">
      <button class="primary" id="startCam">カメラで開始</button>
      <button id="pickFile">動画を分析</button>
    </div>
    <input type="file" id="file" accept="video/*" hidden>
  </div>

  <div id="stage"><canvas id="cv"></canvas><div id="status" class="wait">準備中…</div></div>
  <div class="row" id="ctrl" style="display:none;margin-top:10px"><button id="stop">終了</button></div>

  <div id="results"></div>
  <div class="card"><small>数値はスマホ1台の映像からの推定です。ストレッチは反動をつけず、痛みの出ない範囲で行ってください。</small>
    <div class="row" style="margin-top:8px"><button id="clearHist">記録を消す</button></div>
  </div>
  <div id="log"></div>
</main>

<video id="vid" playsinline muted hidden></video>
<script>
// ---------------------------------------------------------------- 設定
const CDN = (new URLSearchParams(location.search).get("cdn")) || "https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/";
const NOSE=0,L_SH=11,R_SH=12,L_EL=13,R_EL=14,L_WR=15,R_WR=16,L_HIP=23,R_HIP=24,L_KN=25,R_KN=26,L_AN=27,R_AN=28;
const BONES=[[L_SH,R_SH],[L_SH,L_EL],[L_EL,L_WR],[R_SH,R_EL],[R_EL,R_WR],[L_SH,L_HIP],[R_SH,R_HIP],[L_HIP,R_HIP],[L_HIP,L_KN],[L_KN,L_AN],[R_HIP,R_KN],[R_KN,R_AN]];
const $=id=>document.getElementById(id);
const logEl=$("log"); const log=(...a)=>{ if(window.DEBUG){ logEl.textContent+=a.join(" ")+"\n"; } console.log(...a); };
window.swingResults=[];  // テストで読む

// ---------------------------------------------------------------- 練習ドリル(音声の一言)
const DRILL={
  spine_loss:"練習は、お尻をゴルフバッグに軽く当てたまま、ハーフスイングで前傾をキープする素振りがおすすめです。",
  early_ext:"練習は、お尻をゴルフバッグに当てたまま打つ壁ドリルがおすすめです。",
  spine_addr:"構えるときに、クラブを背中に当てて、頭とお尻をつけたままお辞儀する練習をしてみましょう。",
  head_rise:"練習は、打ったあともボールがあった場所を1秒見続けるのがおすすめです。",
  head_sink:"練習は、アドレスのひざの角度を変えずに、その場で回る素振りがおすすめです。",
  over_top:"練習は、ボールの外側にヘッドカバーを置いて、当てないように打つドリルがおすすめです。",
  shoulder_turn:"練習は、クラブを胸の前で抱えて、背中を目標に向けるまで回す素振りがおすすめです。",
  xfactor:"練習は、右ひざの向きを変えないまま、肩だけ深く回す素振りがおすすめです。",
  lead_elbow:"練習は、左手一本で短く持ってのハーフスイングがおすすめです。",
};
const NAME={spine_loss:"インパクトでの起き上がり",early_ext:"伸び上がり",spine_addr:"アドレスの前傾",head_rise:"頭の上下",
  path_loop:"手の通り道",shoulder_turn:"肩の回転",lead_elbow:"トップでの腕の伸び",hip_turn:"腰の回転"};
const UNIT={spine_loss:"度",spine_addr:"度",shoulder_turn:"度",hip_turn:"度",lead_elbow:"度",early_ext:"",head_rise:"",path_loop:""};
const PRO={shoulder_turn:[">=",85,"約90度"],lead_elbow:[">=",160,"160度以上"],spine_addr:["range",[30,45],"30〜45度"],
  spine_loss:["<=",8,"8度以内"],early_ext:["<=",0.05,"ほぼ0"],head_rise:["abs<=",0.06,"ほぼ0"],path_loop:["<=",0,"0以下"]};
const SCALE={shoulder_turn:15,lead_elbow:15,spine_loss:6,early_ext:0.08,path_loop:0.25,spine_addr:4,head_rise:0.06};
const ADV_DIR={spine_loss:1,early_ext:1,path_loop:1,head_rise:0,shoulder_turn:-1,lead_elbow:-1,spine_addr:0};
const ADV_KEY={spine_loss:"spine_loss",early_ext:"early_ext",path_loop:"over_top",shoulder_turn:"shoulder_turn",lead_elbow:"lead_elbow",spine_addr:"spine_addr",head_rise:"head_rise"};

// イヤホンで聞く用の短い一言(画面には詳しい説明を出す)
const SHORT={
  over_top:"手が外側から下りています。右ひじを右腰の前に落とすイメージで。",
  spine_loss:"インパクトで前傾が起き上がっています。胸を下に向けたまま打ちましょう。",
  early_ext:"腰がボール側に出ています。お尻の位置をキープして回りましょう。",
  spine_addr:"アドレスの前傾が浅めです。股関節からお辞儀して構えましょう。",
  head_rise:"インパクトで頭が上がっています。",
  head_sink:"インパクトで頭が沈んでいます。",
  shoulder_turn:"肩の回転が浅めです。背中を目標に向けるまで回しましょう。",
  xfactor:"肩と腰が一緒に回っています。腰を少し我慢しましょう。",
  lead_elbow:"トップで左ひじが曲がっています。",
};

// ---------------------------------------------------------------- 数学の道具
const num=v=>typeof v==="number"&&isFinite(v);
const deg=r=>r*180/Math.PI;
function interp(x,xp,fp){ if(x<=xp[0])return fp[0]; for(let i=1;i<xp.length;i++){ if(x<=xp[i]){ const t=(x-xp[i-1])/((xp[i]-xp[i-1])||1e-9); return fp[i-1]+t*(fp[i]-fp[i-1]); } } return fp[fp.length-1]; }
function gradient(a){ const n=a.length,g=new Array(n); for(let i=0;i<n;i++){ if(n<2){g[i]=0;continue;} g[i]= i===0? a[1]-a[0] : i===n-1? a[n-1]-a[n-2] : (a[i+1]-a[i-1])/2; } return g; }
function argmax(a,lo=0,hi=a.length){ let b=lo; for(let i=lo;i<hi;i++) if(a[i]>a[b]) b=i; return b; }
function argmin(a,lo=0,hi=a.length){ let b=lo; for(let i=lo;i<hi;i++) if(a[i]<a[b]) b=i; return b; }
function percentile(a,p){ const s=[...a].sort((x,y)=>x-y); const k=(s.length-1)*p/100, f=Math.floor(k), c=Math.ceil(k); return f===c? s[f] : s[f]+(s[c]-s[f])*(k-f); }
function median(a){ return percentile(a,50); }

// frames: [{img:[[x,y,z]*33]|null, world:[[x,y,z]*33]|null}]  -> 抜けを補って平滑化した配列
function fillSmooth(arrs,k=5){
  const n=arrs.length, out=arrs.map(a=>a? a.map(p=>p.slice()) : null);
  const tmpl=arrs.find(a=>a); if(!tmpl) return null;
  const P=tmpl.length;
  const res=Array.from({length:n},()=>Array.from({length:P},()=>[0,0,0]));
  for(let p=0;p<P;p++) for(let c=0;c<3;c++){
    const xs=[],ys=[];
    for(let i=0;i<n;i++) if(out[i]){ xs.push(i); ys.push(out[i][p][c]); }
    const col=new Array(n);
    for(let i=0;i<n;i++) col[i]= out[i]? out[i][p][c] : interp(i,xs,ys);
    const pad=k>>1;
    for(let i=0;i<n;i++){ let s=0; for(let j=i-pad;j<=i+pad;j++) s+=col[Math.min(n-1,Math.max(0,j))]; res[i][p][c]= n>=k? s/k : col[i]; }
  }
  return res;
}

// ---------------------------------------------------------------- スイングの場面と区切り(Python版と同じ考え方)
function wrists(img){ return { wy:img.map(f=>(f[L_WR][1]+f[R_WR][1])/2), wx:img.map(f=>(f[L_WR][0]+f[R_WR][0])/2) }; }
function findPhases(img,fps){
  const {wy,wx}=wrists(img); const gx=gradient(wx),gy=gradient(wy); const speed=gx.map((v,i)=>Math.hypot(v,gy[i]));
  const n=wy.length, win=Math.max(2,Math.round(0.12*fps));
  const fastest=argmax(speed); const lo=Math.max(0,fastest-win), hi=Math.min(n,fastest+win+1);
  const impact=argmax(wy,lo,hi); if(impact<2) throw new Error("no swing");
  const top=argmin(wy,0,impact);
  let address=0;
  if(top>=1){ let low=-1e9; for(let i=0;i<=top;i++) low=Math.max(low,wy[i]);
    const thr=percentile(speed,30); address=argmax(wy,0,top+1);
    for(let i=top;i>=0;i--){ if(wy[i]>low-0.03 && speed[i]<thr){ address=i; break; } } }
  const finish= impact<n-1? impact+argmin(wy,impact,n)-impact : impact;
  if(!(address<=top && top<impact && impact<=finish)) throw new Error("phase");
  return {address,top,impact,finish};
}
function aspect(img,ratio){ return img.map(f=>f.map(p=>[p[0]*ratio,p[1],p[2]])); }
function center(f,a,b){ return [(f[a][0]+f[b][0])/2,(f[a][1]+f[b][1])/2]; }
function findSwings(imgM,fps){
  const n=imgM.length; if(n<5) return [];
  const {wy,wx}=wrists(imgM); const shy=imgM.map(f=>(f[L_SH][1]+f[R_SH][1])/2), hipy=imgM.map(f=>(f[L_HIP][1]+f[R_HIP][1])/2);
  const gx=gradient(wx),gy=gradient(wy); const speed=gx.map((v,i)=>Math.hypot(v,gy[i])*fps);
  const mx=Math.max(...speed); if(mx<=0) return [];
  const gap=Math.round(2*fps), after=Math.round(2.5*fps), thr=0.35*mx;
  const order=[...speed.keys()].sort((a,b)=>speed[b]-speed[a]); const peaks=[];
  for(const i of order){ if(speed[i]<thr) break; if(peaks.every(p=>Math.abs(i-p)>gap)) peaks.push(i); }
  peaks.sort((a,b)=>a-b);
  const sw=[];
  for(const p of peaks){
    const lo=Math.max(0,p-Math.round(0.8*fps)); if(p-lo<2) continue;
    const top=argmin(wy,lo,p); if(wy[top]>=shy[top] || (p-top)>0.6*fps) continue;
    // トップの前(2.5秒以内)に、手が腰の高さ(アドレス)にあったこと … フィニッシュ後にクラブを下ろす動きを除く
    let low=false; for(let i=Math.max(0,top-Math.round(2.5*fps)); i<top; i++) if(wy[i]>=hipy[i]-0.03){ low=true; break; } if(!low) continue;
    const a=Math.max(0,p-Math.round(0.1*fps)), b=Math.min(n,p+Math.round(0.15*fps)+1);
    let m=-1e9; for(let i=a;i<b;i++) m=Math.max(m,wy[i]); if(m<(shy[p]+hipy[p])/2) continue;
    sw.push(p);
  }
  const segs=[];
  sw.forEach((p,k)=>{
    let lo=Math.max(0,p-Math.round(4*fps)), hi=Math.min(n,p+after);
    if(k>0) lo=Math.max(lo,(sw[k-1]+p)>>1); if(k+1<sw.length) hi=Math.min(hi,(p+sw[k+1])>>1);
    try{ const ph=findPhases(imgM.slice(lo,hi),fps); if(ph.top-ph.address<0.3*fps) return; segs.push([lo,hi,p]); }catch(e){}
  });
  return segs;
}

// ---------------------------------------------------------------- 数値を出す
function spineTilt(f){ const hip=center(f,L_HIP,R_HIP), sh=center(f,L_SH,R_SH); return deg(Math.atan2(Math.abs(sh[0]-hip[0]),Math.max(hip[1]-sh[1],1e-6))); }
function yaw(w,a,b){ return deg(Math.atan2(w[a][2]-w[b][2], w[a][0]-w[b][0])); }
function turn(world,a,b,f0,f1){ let d=Math.abs(yaw(world[f1],a,b)-yaw(world[f0],a,b)); return d>180? 360-d : d; }
function angle3(w,a,b,c){ const v1=[0,1,2].map(i=>w[a][i]-w[b][i]), v2=[0,1,2].map(i=>w[c][i]-w[b][i]);
  const d=v1[0]*v2[0]+v1[1]*v2[1]+v1[2]*v2[2], n1=Math.hypot(...v1), n2=Math.hypot(...v2); return deg(Math.acos(Math.max(-1,Math.min(1,d/(n1*n2+1e-9))))); }
function isFaceOn(imgM,world,f){
  const ys=[];
  for(let g=Math.max(0,f-3); g<Math.min(world.length,f+4); g++) for(const [a,b] of [[L_SH,R_SH],[L_HIP,R_HIP]]){
    let d=Math.abs(yaw(world[g],a,b))%180; ys.push(Math.min(d,180-d)); }
  const sw=Math.abs(imgM[f][L_SH][0]-imgM[f][R_SH][0]);
  const sh=center(imgM[f],L_SH,R_SH), hp=center(imgM[f],L_HIP,R_HIP), torso=Math.hypot(sh[0]-hp[0],sh[1]-hp[1]);
  return median(ys)<45 && torso>0 && sw/torso>=0.4;
}
function metrics(imgM,world,ph,lefty){
  const {address:a,top:t,impact:i}=ph;
  const sh=center(imgM[a],L_SH,R_SH), hp=center(imgM[a],L_HIP,R_HIP); const torso=Math.hypot(sh[0]-hp[0],sh[1]-hp[1])||1e-6;
  const toBall= imgM[a][NOSE][0]>=hp[0]? 1 : -1;
  const hipx=f=>(imgM[f][L_HIP][0]+imgM[f][R_HIP][0])/2;
  const sa=spineTilt(imgM[a]);
  const m={ spine_addr:Math.round(sa), spine_loss:Math.round(sa-spineTilt(imgM[i])),
    early_ext:+((hipx(i)-hipx(a))*toBall/torso).toFixed(2), head_rise:+((imgM[a][NOSE][1]-imgM[i][NOSE][1])/torso).toFixed(2),
    shoulder_turn:Math.round(turn(world,L_SH,R_SH,a,t)), hip_turn:Math.round(turn(world,L_HIP,R_HIP,a,t)),
    lead_elbow:Math.round(lefty? angle3(world[t],R_SH,R_EL,R_WR) : angle3(world[t],L_SH,L_EL,L_WR)), path_loop:NaN };
  // 手の通り道(同じ高さで、上げる手と下ろす手の位置の差)
  const wr=f=>[(imgM[f][L_WR][0]+imgM[f][R_WR][0])/2,(imgM[f][L_WR][1]+imgM[f][R_WR][1])/2];
  const zone=[]; for(let k=t;k<=i;k++){ const s=center(imgM[k],L_SH,R_SH); const y=wr(k)[1]; if(s[1]<=y && y<=wr(a)[1]-0.1*torso) zone.push(k); }
  if(zone.length>=2 && t>a){
    const back=[]; for(let k=a;k<=t;k++) back.push(wr(k)); back.sort((p,q)=>p[1]-q[1]);
    const by=back.map(p=>p[1]), bx=back.map(p=>p[0]);
    const loops=zone.map(k=>(wr(k)[0]-interp(wr(k)[1],by,bx))*toBall/torso);
    m.path_loop=+(loops.reduce((s,v)=>s+v,0)/loops.length).toFixed(2);
  }
  return m;
}

// ---------------------------------------------------------------- アドバイス
function adviseStd(m,theme){
  const tips={頭:[],前傾:[],軌道:[],回転:[],左腕:[]}, good={};
  if(m.head_rise>0.12) tips.頭.push(["head_rise",m.head_rise*3,"インパクトで頭が上がっています。打ち終わるまで、頭の高さを変えないつもりで振りましょう。"]);
  if(m.head_rise<-0.12) tips.頭.push(["head_sink",-m.head_rise*3,"インパクトで頭が沈み込んでいます。アドレスの高さのまま、その場で回るイメージで振りましょう。"]);
  good.頭="頭の高さが最後まで変わらず、安定しています。";
  if(m.spine_loss>8) tips.前傾.push(["spine_loss",m.spine_loss/10,`インパクトで前傾がおよそ${m.spine_loss}度起き上がっています。お辞儀の角度を保ったまま、胸を下に向けて打ちましょう。`]);
  if(m.early_ext>0.1) tips.前傾.push(["early_ext",m.early_ext*8,"インパクトで腰がボールに近づいて、伸び上がっています。お尻を後ろの壁につけたまま回るイメージで振りましょう。"]);
  if(m.spine_addr<20) tips.前傾.push(["spine_addr",(20-m.spine_addr)/10,`アドレスの前傾がおよそ${m.spine_addr}度と浅めです。股関節から少しお辞儀を深くして構えましょう。`]);
  good.前傾="アドレスの前傾が、インパクトまでしっかりキープできています。";
  if(num(m.path_loop) && m.path_loop>0.3){ let t="切り返しで手が外側から下りてきています。アウトサイドイン(カット軌道)になりやすく、スライスの原因になる動きです。切り返しでは、右ひじを右腰の前に落とすイメージで、手を体の近くに下ろしましょう。";
    if(m.early_ext>0.1) t+="腰がボール側に出る伸び上がりとセットで起きやすいので、お尻の位置をキープすると両方直りやすくなります。";
    tips.軌道.push(["over_top",m.path_loop*3,t]); }
  good.軌道= num(m.path_loop)? "クラブが良い通り道で下りてきています。" : "今回はクラブの通り道をうまく測れませんでした。";
  const turnOk=m.shoulder_turn>=30;
  if(!turnOk) good.回転="今回は肩の回転をうまく測れませんでした。";
  else { if(m.shoulder_turn<70) tips.回転.push(["shoulder_turn",(70-m.shoulder_turn)/40,`肩の回転がおよそ${m.shoulder_turn}度と浅めです。背中を目標に向けるつもりで、もう少し深く回してみましょう。`]);
    else if(m.shoulder_turn-m.hip_turn<20) tips.回転.push(["xfactor",(20-(m.shoulder_turn-m.hip_turn))/30,"肩と腰が一緒に回っていて、ねじれが少なめです。腰の回転を少し我慢して、肩を深く回しましょう。"]);
    good.回転=`肩がおよそ${m.shoulder_turn}度回っていて、しっかり捻転できています。`; }
  if(m.lead_elbow<150) tips.左腕.push(["lead_elbow",(150-m.lead_elbow)/30,"トップで左腕の肘が曲がっています。トップを少し小さくしてでも、左腕を伸ばしたまま上げましょう。"]);
  good.左腕="トップで左腕がしっかり伸びています。";
  let pool;
  if(theme==="全部"){ pool=Object.values(tips).flat(); if(!pool.length) return [["",0,"全体的にバランスの良いスイングです。この感じを続けましょう。"]]; }
  else { pool=tips[theme]||[]; if(!pool.length) return [["",0,good[theme]]]; }
  return pool.sort((x,y)=>y[1]-x[1]).slice(0,2);
}
function history(){ try{ return JSON.parse(localStorage.getItem("swingHistory")||"[]"); }catch(e){ return []; } }
function saveHistory(m){ try{ const h=history(); h.push({t:Date.now(),...m}); localStorage.setItem("swingHistory",JSON.stringify(h.slice(-200))); }catch(e){} }
function adviseAdvanced(m){
  const rows=history().slice(-30), items=[], lines=[];
  for(const k of Object.keys(ADV_DIR)){
    let vals=rows.map(r=>r[k]).filter(num); if(k==="shoulder_turn") vals=vals.filter(v=>v>=30);
    if(vals.length<5 || !num(m[k]) || (k==="shoulder_turn"&&m[k]<30)) continue;
    const med=median(vals), sd=(median(vals.map(v=>Math.abs(v-med)))*1.4826)||1e-6;
    const z=(m[k]-med)/Math.max(sd,SCALE[k]*0.5), d=ADV_DIR[k];
    const f=v=>UNIT[k]==="度"? `${Math.round(v)}度` : v.toFixed(2);
    lines.push([NAME[k],`今回 ${f(m[k])} / いつも ${f(med)}`]);
    if((d!==0&&z*d>1.5)||(d===0&&Math.abs(z)>2)) items.push([ADV_KEY[k],Math.abs(z),`今の1本は、いつものあなたより${NAME[k]}がずれています(今回${f(m[k])}、いつもは${f(med)}くらい)。`]);
  }
  if(!lines.length) return null;
  items.sort((x,y)=>y[1]-x[1]);
  return {items: items.length? items.slice(0,2) : [["",0,"いつものあなたのスイングと比べて、安定して振れています。"]], lines};
}
function proRows(m){
  return Object.entries(PRO).filter(([k])=>num(m[k]) && !(k==="shoulder_turn"&&m[k]<30)).map(([k,[kind,ref,label]])=>{
    const v=m[k], s=SCALE[k]||0.1; let gap=0;
    if(kind===">=") gap=Math.max(0,(ref-v)/s); else if(kind==="<=") gap=Math.max(0,(v-ref)/s);
    else if(kind==="abs<=") gap=Math.max(0,(Math.abs(v)-ref)/s); else gap=Math.max(0,(ref[0]-v)/s,(v-ref[1])/s);
    return [NAME[k], `${v}${UNIT[k]} (目安 ${label})`, gap===0];
  });
}

// ---------------------------------------------------------------- 音声
let voice=null;
function pickVoice(){ const vs=speechSynthesis.getVoices(); voice=vs.find(v=>/ja(-|_)JP/i.test(v.lang))||vs.find(v=>/^ja/i.test(v.lang))||null; }
if("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
function speak(text){ log("SPEAK:",text); if(!("speechSynthesis" in window)) return; const u=new SpeechSynthesisUtterance(text); u.lang="ja-JP"; if(voice) u.voice=voice; u.rate=1.05; speechSynthesis.speak(u); }

// ---------------------------------------------------------------- 1本分の分析
function analyzeSwing(img,world,fps,ratio,lo,hi,no){
  const imgM=aspect(img,ratio);
  const ph0=findPhases(img.slice(lo,hi),fps);
  const ph={address:ph0.address+lo,top:ph0.top+lo,impact:ph0.impact+lo,finish:ph0.finish+lo};
  if(isFaceOn(imgM,world,ph.address)){
    const r={no,faceOn:true,text:["正面から撮った映像のようです。このページは後ろ(飛球線の後方)からの映像用です。スマホを体の後ろ側に置いてください。"]};
    return r;
  }
  const lefty=$("hand").value==="L", theme=$("theme").value, mode=$("mode").value;
  const m=metrics(imgM,world,ph,lefty);
  let items=adviseStd(m,theme), lines=null, adv=null;
  if(mode==="上級者"){ adv=adviseAdvanced(m); if(adv){ items=adv.items; lines=adv.lines; } }
  saveHistory(m);
  const keys=items.map(x=>x[0]).filter(Boolean);
  const text=items.map(x=>x[2]); if(mode==="上級者" && !adv) text.push("上級者モードは、記録が5本以上たまると使えます。");
  const voiceText=items.map(x=>SHORT[x[0]]||x[2]).concat(keys.length&&DRILL[keys[0]]? [DRILL[keys[0]]] : []);
  return {no,faceOn:false,ph,m,keys,text,voiceText,lines: lines || proRows(m), mode};
}
function renderResult(r){
  const el=document.createElement("div"); el.className="card res";
  const head=`<h3>${r.no}本目</h3>`;
  if(r.faceOn){ el.innerHTML=head+`<p>${r.text[0]}</p>`; }
  else {
    const rows=r.lines.map(l=>`<div class="metric"><span>${l[0]}</span><b class="${l[2]===undefined?'':(l[2]?'ok':'ng')}">${l[1]}</b></div>`).join("");
    el.innerHTML=head+rows+`<ul>${r.text.map(t=>`<li>${t}</li>`).join("")}</ul>`+(r.keys.length&&DRILL[r.keys[0]]?`<p class="note">${DRILL[r.keys[0]]}</p>`:"");
  }
  $("results").prepend(el);
}
function summarize(rs){
  const valid=rs.filter(r=>!r.faceOn); if(valid.length<2) return null;
  const cnt={}; valid.forEach(r=>[...new Set(r.keys)].forEach(k=>cnt[k]=(cnt[k]||0)+1));
  const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
  let msg=`${valid.length}本のまとめです。`;
  const nm={spine_loss:"インパクトでの起き上がり",early_ext:"伸び上がり",over_top:"手が外から下りる動き",head_rise:"頭が上がる動き",shoulder_turn:"肩の回転の浅さ",lead_elbow:"左ひじの曲がり",xfactor:"ねじれの少なさ",spine_addr:"アドレスの前傾の浅さ",head_sink:"頭の沈み込み"};
  if(top && top[1]>=2) msg+=`${top[1]}本で${nm[top[0]]||top[0]}が出ていました。これが今日の一番の課題です。`+(DRILL[top[0]]? " "+DRILL[top[0]].replace("練習は、","今日の練習には、") : "");
  else msg+="毎回ちがう点が出ていて、大きな癖は見えませんでした。";
  return msg;
}

// ---------------------------------------------------------------- 姿勢推定
let pose=null, lastResults=null;
function loadScript(src){ return new Promise((ok,ng)=>{ const s=document.createElement("script"); s.src=src; s.crossOrigin="anonymous"; s.onload=ok; s.onerror=()=>ng(new Error("load "+src)); document.head.appendChild(s); }); }
async function initPose(){
  if(pose) return pose;
  if(!window.Pose) await loadScript(CDN+"pose.js");
  pose=new Pose({locateFile:f=>CDN+f});
  pose.setOptions({modelComplexity:+$("quality").value, smoothLandmarks:true, enableSegmentation:false, minDetectionConfidence:0.5, minTrackingConfidence:0.5});
  pose.onResults(r=>{ lastResults=r; });
  await pose.initialize();
  return pose;
}
function toArr(lms){ return lms? lms.map(p=>[p.x,p.y,p.z??0]) : null; }

const cv=$("cv"), ctx=cv.getContext("2d");
function draw(src,lms,status){
  const w=src.videoWidth||src.width, h=src.videoHeight||src.height; if(!w) return;
  if(cv.width!==w){ cv.width=w; cv.height=h; }
  ctx.drawImage(src,0,0,w,h);
  if(lms){ ctx.lineWidth=Math.max(2,w/240); ctx.strokeStyle="#4ade80";
    for(const [a,b] of BONES){ ctx.beginPath(); ctx.moveTo(lms[a][0]*w,lms[a][1]*h); ctx.lineTo(lms[b][0]*w,lms[b][1]*h); ctx.stroke(); } }
}
function setStatus(t,cls){ const s=$("status"); s.textContent=t; s.className=cls; }

// ---------------------------------------------------------------- ライブ(カメラ)の流れ
// 直近の映像の関節を貯め、0.5秒ごとに「終わったスイング」がないか探す。
// 構えて止まったら「チェック開始」と伝え、フィニッシュから約1.2秒後に結果を伝える。
class Live{
  constructor(ratio){ this.buf=[]; this.ratio=ratio; this.lastImpactT=-1e9; this.lastCheck=0; this.armed=false; this.no=0; this.results=[]; }
  push(t,img,world){
    this.buf.push({t,img,world}); while(this.buf.length && t-this.buf[0].t>9000) this.buf.shift();
    this.checkAddress(t);
    if(t-this.lastCheck>500){ this.lastCheck=t; this.scan(t); }
  }
  fps(){ const b=this.buf; return b.length>1? (b.length-1)/((b[b.length-1].t-b[0].t)/1000) : 30; }
  checkAddress(t){
    // 直近0.7秒、手が腰より下で止まっていて、前かがみなら「構え」
    const fps=this.fps(), k=Math.round(0.7*fps), recent=this.buf.slice(-k).filter(f=>f.img);
    if(recent.length<k*0.8 || this.armed) return;
    const wy=recent.map(f=>(f.img[L_WR][1]+f.img[R_WR][1])/2), wx=recent.map(f=>(f.img[L_WR][0]+f.img[R_WR][0])/2);
    const still=(Math.max(...wy)-Math.min(...wy))<0.03 && (Math.max(...wx)-Math.min(...wx))<0.03;
    const f=recent[recent.length-1].img, hipY=(f[L_HIP][1]+f[R_HIP][1])/2;
    const imgM=aspect([f],this.ratio)[0];
    if(still && wy[wy.length-1]>hipY && spineTilt(imgM)>15 && t-this.lastImpactT>2500){ this.armed=true; setStatus("チェック中","busy"); speak("チェック開始"); }
  }
  voiceFor(r){
    // 同じ課題が続くときは短く。練習ドリルは、課題が変わったときと5本ごとに伝える
    const top=r.keys[0]||"", prev=this.prevKey; this.prevKey=top;
    const short=r.voiceText.slice(0, r.keys.length? r.keys.length : 1).filter(t=>!t.startsWith("練習は"));
    let text = (top && top===prev)? "前の1本と同じく、"+short[0] : short.join(" ");
    if(top && DRILL[top] && (top!==prev || r.no%5===0)) text+=" "+DRILL[top];
    if(!top) text=r.voiceText.join(" ");
    return text;
  }
  scan(t){
    const b=this.buf; if(b.length<30) return;
    const img=fillSmooth(b.map(f=>f.img)), world=fillSmooth(b.map(f=>f.world)); if(!img) return;
    const fps=this.fps(), imgM=aspect(img,this.ratio);
    for(const [lo,hi,p] of findSwings(imgM,fps)){
      const tImp=b[p].t;
      if(tImp<=this.lastImpactT+1500 || t-tImp<1200) continue;   // もう伝えた / まだフィニッシュ中
      this.lastImpactT=tImp; this.armed=false;
      try{ const r=analyzeSwing(img,world,fps,this.ratio,lo,Math.min(hi,b.length),++this.no); r.t=tImp; this.results.push(r); window.swingResults.push(r); renderResult(r);
        speak(`${r.no}本目。`+(r.faceOn? r.text[0] : this.voiceFor(r))); }
      catch(e){ log("analyze error",e.message); }
      setStatus("待機中(構えると開始)","wait");
    }
  }
}

let running=false, stream=null, live=null, wakeLock=null;
// テスト用: 関節データを実際の時間どおりに流し込んで、ライブの流れを確かめる
window.simulateLive=function(frames,fps,ratio){
  const L=new Live(ratio); live=L;
  frames.forEach((f,i)=>L.push(i*1000/fps, f.img, f.world));
  return L.results.map(r=>({no:r.no,t:r.t,faceOn:r.faceOn,m:r.m,keys:r.keys,voice:r.voiceText}));
};
async function startCamera(){
  speak("準備をしています"); // iPhoneでは、ボタンを押したときに一度話しておかないと音声が出ない
  $("setup").style.display="none"; $("stage").style.display="block"; $("ctrl").style.display="flex";
  setStatus("カメラを準備中…","wait");
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment",width:{ideal:720},height:{ideal:1280}},audio:false});
  }catch(e){ setStatus("カメラを使えませんでした","wait"); alert("カメラを使えませんでした。ブラウザの設定でカメラを許可してください。("+e.message+")"); return; }
  const v=$("vid"); v.srcObject=stream; await v.play();
  setStatus("姿勢推定を準備中…","wait"); await initPose();
  try{ wakeLock=await navigator.wakeLock?.request("screen"); }catch(e){}
  live=new Live(v.videoWidth/v.videoHeight); running=true;
  setStatus("待機中(構えると開始)","wait"); speak("準備ができました。構えるとチェックを始めます。");
  const loop=async()=>{ if(!running) return;
    await pose.send({image:v}); const r=lastResults;
    live.push(performance.now(), toArr(r&&r.poseLandmarks), toArr(r&&r.poseWorldLandmarks));
    draw(v, toArr(r&&r.poseLandmarks));
    const f=live.fps(); if(f<12 && live.buf.length>60 && !live.warned){ live.warned=true; speak("処理が追いついていません。解析の細かさを軽いにしてください。"); }
    requestAnimationFrame(loop); };
  loop();
}
function stop(){
  running=false; if(stream) stream.getTracks().forEach(t=>t.stop()); try{ wakeLock&&wakeLock.release(); }catch(e){}
  if(live){ const s=summarize(live.results); if(s){ speak(s); const el=document.createElement("div"); el.className="card res"; el.innerHTML=`<h3>まとめ</h3><p>${s}</p>`; $("results").prepend(el); } }
  $("setup").style.display="block"; $("ctrl").style.display="none";
}

// ---------------------------------------------------------------- 動画ファイル(撮った動画の分析・テスト用)
async function analyzeFile(file){
  speak("動画を分析します");
  $("setup").style.display="none"; $("stage").style.display="block";
  const v=$("vid"); v.srcObject=null; v.src=URL.createObjectURL(file);
  await new Promise(r=>v.onloadedmetadata=r);
  setStatus("姿勢推定を準備中…","wait"); await initPose();
  const fps=30, dur=v.duration, frames=[];
  for(let t=0; t<dur; t+=1/fps){
    v.currentTime=t; await new Promise(r=>v.onseeked=r);
    await pose.send({image:v}); const r=lastResults;
    frames.push({img:toArr(r&&r.poseLandmarks), world:toArr(r&&r.poseWorldLandmarks)});
    draw(v,toArr(r&&r.poseLandmarks)); setStatus(`解析中 ${Math.round(t/dur*100)}%`,"busy");
  }
  const img=fillSmooth(frames.map(f=>f.img)), world=fillSmooth(frames.map(f=>f.world));
  const results=[];
  if(img){ const ratio=v.videoWidth/v.videoHeight, imgM=aspect(img,ratio);
    let segs=findSwings(imgM,fps); if(!segs.length) segs=[[0,img.length,0]];
    if(window.DEBUG){ window.lastSegs=segs; window.lastImg=img; }
    segs.forEach(([lo,hi],k)=>{ try{ const r=analyzeSwing(img,world,fps,ratio,lo,hi,k+1); results.push(r); window.swingResults.push(r); renderResult(r);
      speak((segs.length>1?`${r.no}本目。`:"")+(r.faceOn? r.text[0] : r.voiceText.join(" "))); }catch(e){ log("analyze error",e.message); } });
  }
  if(!results.length){ speak("スイングを見つけられませんでした。"); }
  const s=summarize(results); if(s){ speak(s); const el=document.createElement("div"); el.className="card res"; el.innerHTML=`<h3>まとめ</h3><p>${s}</p>`; $("results").prepend(el); }
  setStatus("分析が終わりました","ready"); $("setup").style.display="block";
  window.analysisDone=true;
}

$("startCam").onclick=startCamera; $("stop").onclick=stop;
$("pickFile").onclick=()=>$("file").click();
$("file").onchange=e=>{ if(e.target.files[0]) analyzeFile(e.target.files[0]); };
$("clearHist").onclick=()=>{ if(confirm("これまでの記録を消しますか?")){ localStorage.removeItem("swingHistory"); } };
window.DEBUG=new URLSearchParams(location.search).has("debug");
</script>
